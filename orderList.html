<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0 user-scalable=no"
    />
    <title>Open Fashion</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/main.css" />

          <div class="orderInfoWrap"></div>
          <ul class="productsWrap orderProducts"></ul>

            <p class="price">order price <span></span></p>
          </div>
        </section>
      </main>
      <footer id="footer"></footer>
    </div>
    <script type="module" src="./js/include.js"></script>
    <script type="module" src="./js/data/renderData.js"></script>
