<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Fashion</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/blog.css" />
    <link rel="stylesheet" href="./css/lib/tenorSans.css" />
    <link rel="stylesheet" href="./css/lib/bodonimoda.css" />
    <link rel="stylesheet" href="./css/lib/swiper-bundle.min.css" />
    <script src="./js/lib/swiper-bundle.min.js"></script>
  </head>
  <body>
    <div class="wrap">
      <header class="headerContainer"></header>
      <main id="main">
        <section class="section blog">
          <h3 class="sectionMainTit tit">
            blog
            <span class="titIcon">
              <img src="./images/icons/titUnder.svg" alt="tit under icon" />
            </span>
          </h3>
          <div class="blogContainer">
            <button class="listBtn">
              <img class="list" src="./images/icons/list.svg" alt="show list" />
              <img
                class="gallery"
                src="./images/icons/gallery.svg"
                alt="show gallery"
              />
            </button>
            <ul class="blogWrap"></ul>
          </div>
        </section>
      </main>
      <footer id="footer"></footer>
    </div>
    <script type="module" src="./js/include.js"></script>
    <script type="module" src="./js/data/renderData.js"></script>
    <script src="./js/common.js"></script>
    <script type="module" src="./js/blog.js"></script>
  </body>
</html>
